name: Publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish, for example v1.0.0
        required: true

jobs:
  publish:
    runs-on: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate, package, and publish
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail

          release_tag="$INPUT_RELEASE_TAG"
          if [ -z "$release_tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          if [ -z "$release_tag" ]; then
            echo "No release tag was provided." >&2
            exit 1
          fi

          git fetch --force --tags origin
          git checkout "$release_tag"

          python3 scripts/assemble_theme.py
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('space-cadet-theme.xml')"

          version="$(python3 -c "import json; print(json.load(open('theme.json', encoding='utf-8'))['theme_version'])")"
          if [ -z "$version" ]; then
            echo "Theme version is missing." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Theme version is invalid: $version" >&2
            exit 1
          fi
          if [[ "${release_tag#v}" != "$version" ]]; then
            echo "Tag $release_tag does not match theme version $version." >&2
            exit 1
          fi

          mkdir -p dist
          archive_name="mybb-space-cadet-theme-$version.zip"
          archive="dist/$archive_name"
          zip -X -q -r "$archive" images space-cadet-theme.xml README.md LICENSE

          archive_contents="$(unzip -Z1 "$archive")"
          required_entries=(
            images/space-cadet/logo.png
            images/space-cadet/banner-bg.jpg
            space-cadet-theme.xml
            README.md
            LICENSE
          )
          for required_entry in "${required_entries[@]}"; do
            grep -F -x "$required_entry" <<< "$archive_contents" >/dev/null || {
              echo "Archive is missing required entry: $required_entry" >&2
              exit 1
            }
          done

          if grep -E '^(theme_overrides|upstream|scripts|\.git)/' <<< "$archive_contents" >/dev/null; then
            echo "Archive contains development-only files." >&2
            exit 1
          fi

          if [ -z "$GITEA_TOKEN" ]; then
            echo "No workflow token is available to publish the release." >&2
            exit 1
          fi

          release_body="Space Cadet $release_tag for MyBB 1.8.40.

Package includes the importable theme XML, Space Cadet image/font assets, README, and license."

          api_base="$GITEA_API_URL/repos/$REPOSITORY"
          release_json="$(curl -fsS -H "Authorization: token $GITEA_TOKEN" "$api_base/releases/tags/$release_tag" || true)"
          if [ -z "$release_json" ]; then
            release_json="$(jq -n \
              --arg tag "$release_tag" \
              --arg title "Space Cadet $release_tag" \
              --arg body "$release_body" \
              '{tag_name:$tag,name:$title,body:$body,draft:false,prerelease:false}' |
              curl -fsS -X POST \
                -H "Authorization: token $GITEA_TOKEN" \
                -H "Content-Type: application/json" \
                -d @- \
                "$api_base/releases")"
          else
            release_id="$(echo "$release_json" | jq -r '.id')"
            release_json="$(jq -n \
              --arg title "Space Cadet $release_tag" \
              --arg body "$release_body" \
              '{name:$title,body:$body,draft:false,prerelease:false}' |
              curl -fsS -X PATCH \
                -H "Authorization: token $GITEA_TOKEN" \
                -H "Content-Type: application/json" \
                -d @- \
                "$api_base/releases/$release_id")"
          fi

          release_id="$(echo "$release_json" | jq -r '.id')"
          assets="$(curl -fsS -H "Authorization: token $GITEA_TOKEN" "$api_base/releases/$release_id/assets")"
          existing_ids="$(echo "$assets" | jq -r --arg asset "$archive_name" '.[] | select(.name == $asset) | .id')"
          for existing_id in $existing_ids; do
            curl -fsS -X DELETE -H "Authorization: token $GITEA_TOKEN" "$api_base/releases/$release_id/assets/$existing_id" >/dev/null
          done

          curl -fsS -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -F "attachment=@$archive" \
            "$api_base/releases/$release_id/assets?name=$archive_name" >/dev/null

          echo "Published $archive_name to Gitea release $release_tag."
