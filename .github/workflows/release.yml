name: Publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish, for example v1.0.0
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Validate source and package archive
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/assemble_theme.py
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('space-cadet-theme.xml')"

          version="$(python3 -c "import json; print(json.load(open('theme.json', encoding='utf-8'))['theme_version'])")"
          if [ -z "$version" ]; then
            echo "Theme version is missing." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Theme version is invalid: $version." >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG#v}" != "$version" ]]; then
            echo "Tag $RELEASE_TAG does not match theme version $version." >&2
            exit 1
          fi

          mkdir -p dist
          archive="dist/mybb-space-cadet-theme-$version.zip"
          zip -X -q -r "$archive" images space-cadet-theme.xml README.md LICENSE

          archive_contents="$(unzip -Z1 "$archive")"
          required_entries=(
            images/space-cadet/logo.png
            images/space-cadet/banner-bg.jpg
            space-cadet-theme.xml
            README.md
            LICENSE
          )
          for required_entry in "${required_entries[@]}"; do
            grep -F -x "$required_entry" <<< "$archive_contents" >/dev/null || {
              echo "Archive is missing required entry: $required_entry" >&2
              exit 1
            }
          done

          if grep -E '^(theme_overrides|upstream|scripts|\.git)/' <<< "$archive_contents" >/dev/null; then
            echo "Archive contains development-only files." >&2
            exit 1
          fi

          printf '%s\n\n%s\n' \
            "Space Cadet $RELEASE_TAG for MyBB 1.8.40." \
            "Package includes the importable theme XML, Space Cadet image/font assets, README, and license." \
            > release-notes.md

      - name: Create GitHub release or replace its archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Space Cadet $RELEASE_TAG" --notes-file release-notes.md --latest
            gh release upload "$RELEASE_TAG" dist/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip --verify-tag --title "Space Cadet $RELEASE_TAG" --notes-file release-notes.md --latest
          fi
