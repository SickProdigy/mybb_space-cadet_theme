name: Validate and package

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Optional release tag that must match the theme version
        required: false
        type: string
      checkout_ref:
        description: Optional git ref to validate and package
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Validate source, version, and archive
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/assemble_theme.py
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('space-cadet-theme.xml')"

          version="$(python3 -c "import json; print(json.load(open('theme.json', encoding='utf-8'))['theme_version'])")"
          if [ -z "$version" ]; then
            echo "Theme version is missing." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Theme version is invalid: $version" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG_INPUT" && "${RELEASE_TAG_INPUT#v}" != "$version" ]]; then
            echo "Tag $RELEASE_TAG_INPUT does not match theme version $version." >&2
            exit 1
          fi

          mkdir -p dist
          archive="dist/mybb-space-cadet-theme-$version.zip"
          zip -X -q -r "$archive" images space-cadet-theme.xml README.md LICENSE

          archive_contents="$(unzip -Z1 "$archive")"
          required_entries=(
            images/space-cadet/logo.png
            images/space-cadet/banner-bg.jpg
            space-cadet-theme.xml
            README.md
            LICENSE
          )
          for required_entry in "${required_entries[@]}"; do
            grep -F -x "$required_entry" <<< "$archive_contents" >/dev/null || {
              echo "Archive is missing required entry: $required_entry" >&2
              exit 1
            }
          done

          if grep -E '^(theme_overrides|upstream|scripts|\.git)/' <<< "$archive_contents" >/dev/null; then
            echo "Archive contains development-only files." >&2
            exit 1
          fi

          echo "Validation and packaging passed for Space Cadet $version."

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: mybb-space-cadet-theme
          path: dist/*.zip
          if-no-files-found: error
